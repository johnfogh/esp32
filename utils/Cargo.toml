[package]
name = "esp32-utils"
version = "0.12.0"
edition = "2024"
description = "Shared helpers for ESP32-family projects (esp-hal no_std or esp-idf std)"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "utils"

[features]
default = []
# ---- chip (pick exactly one) ----
esp32   = ["esp-hal?/esp32",   "esp-println?/esp32",   "esp-backtrace?/esp32",   "esp-bootloader-esp-idf?/esp32",   "esp-storage?/esp32", "esp-radio?/esp32", "esp-rtos?/esp32", "esp-alloc?/esp32"]
esp32s2 = ["esp-hal?/esp32s2", "esp-println?/esp32s2", "esp-backtrace?/esp32s2", "esp-bootloader-esp-idf?/esp32s2", "esp-storage?/esp32s2"]
esp32s3 = ["esp-hal?/esp32s3", "esp-println?/esp32s3", "esp-backtrace?/esp32s3", "esp-bootloader-esp-idf?/esp32s3", "esp-storage?/esp32s3", "esp-radio?/esp32s3", "esp-rtos?/esp32s3", "esp-alloc?/esp32s3"]
esp32c3 = ["esp-hal?/esp32c3", "esp-println?/esp32c3", "esp-backtrace?/esp32c3", "esp-bootloader-esp-idf?/esp32c3", "esp-storage?/esp32c3", "esp-radio?/esp32c3", "esp-rtos?/esp32c3", "esp-alloc?/esp32c3"]
esp32c6 = ["esp-hal?/esp32c6", "esp-println?/esp32c6", "esp-backtrace?/esp32c6", "esp-bootloader-esp-idf?/esp32c6", "esp-storage?/esp32c6", "esp-radio?/esp32c6", "esp-rtos?/esp32c6", "esp-alloc?/esp32c6"]
esp32h2 = ["esp-hal?/esp32h2", "esp-println?/esp32h2", "esp-backtrace?/esp32h2", "esp-bootloader-esp-idf?/esp32h2", "esp-storage?/esp32h2", "esp-radio?/esp32h2", "esp-rtos?/esp32h2", "esp-alloc?/esp32h2"]
# ---- framework (pick exactly one) ----
hal = ["dep:esp-hal", "dep:esp-println", "dep:esp-backtrace", "dep:esp-bootloader-esp-idf", "dep:esp-storage", "dep:static_cell", "dep:critical-section"]
idf = ["dep:esp-idf-svc"]
# Host-side (desktop, std) helpers: chip table, build/flash command generation. No chip feature needed.
host = []
# BLE: `utils::bluetooth_announce()`. hal: esp-radio + esp-rtos + esp-alloc + trouble-host;
# idf: esp32-nimble (consumer needs CONFIG_BT_NIMBLE_ENABLED in sdkconfig.defaults).
# Without it (or on esp32s2, which has no Bluetooth) bluetooth_announce() returns Err(BleError::Unsupported).
# The BLE deps are target-specific, so nothing is pulled in for the esp32s2 targets.
# Status screen on the Waveshare ESP32-S3-Touch-LCD-2 (ST7789T3 240x320 over SPI): `utils::display::start`.
# hal + esp32s3 only (elsewhere `start` returns Err(Unsupported)); implies `ble` (esp-rtos thread, BLE state, log lines).
display = ["ble", "dep:mipidsi", "dep:embedded-graphics", "dep:embedded-hal-bus"]
# QMI8658 accelerometer on the Waveshare ESP32-S3-Touch-LCD-2: `utils::get_accelerometers` (hal + esp32s3 only;
# elsewhere it returns Err(ImuError::Unsupported)). Implies `ble` (heap + scheduler).
imu = ["ble"]
ble = ["dep:esp-radio", "dep:esp-rtos", "dep:esp-alloc", "dep:trouble-host", "dep:embassy-futures", "dep:embassy-time", "dep:esp-radio-rtos-driver", "dep:embassy-executor", "dep:esp32-nimble"]

[dependencies]
log = "0.4"
esp-hal = { version = "1.2", optional = true, features = ["unstable"] }
esp-println = { version = "0.18", optional = true, features = ["log-04"] }
esp-backtrace = { version = "0.20", optional = true, features = ["panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.6", optional = true }
esp-storage = { version = "0.10", optional = true }
static_cell = { version = "2", optional = true }
critical-section = { version = "1", optional = true }
esp-idf-svc = { version = "0.53", optional = true }

# ---- BLE (feature `ble`), every target except esp32s2 (no Bluetooth) ----
[target.'cfg(all(target_os = "none", not(target_arch = "xtensa")))'.dependencies]
esp-radio = { version = "=1.0.0-beta.1", optional = true, default-features = false, features = ["ble", "unstable", "log-04", "esp-alloc"] }
esp-rtos = { version = "0.4", optional = true, features = ["embassy", "esp-alloc", "esp-radio", "log-04"] }
esp-alloc = { version = "0.11", optional = true }
trouble-host = { version = "0.7", optional = true, features = ["log", "security", "legacy-pairing"] }
embassy-futures = { version = "0.1", optional = true }
embassy-time = { version = "0.5", optional = true }
esp-radio-rtos-driver = { version = "0.4", optional = true }
embassy-executor = { version = "0.10", optional = true }

[target.xtensa-esp32-none-elf.dependencies]
esp-radio = { version = "=1.0.0-beta.1", optional = true, default-features = false, features = ["ble", "unstable", "log-04", "esp-alloc"] }
esp-rtos = { version = "0.4", optional = true, features = ["embassy", "esp-alloc", "esp-radio", "log-04"] }
esp-alloc = { version = "0.11", optional = true }
trouble-host = { version = "0.7", optional = true, features = ["log", "security", "legacy-pairing"] }
embassy-futures = { version = "0.1", optional = true }
embassy-time = { version = "0.5", optional = true }
esp-radio-rtos-driver = { version = "0.4", optional = true }
embassy-executor = { version = "0.10", optional = true }

[target.xtensa-esp32s3-none-elf.dependencies]
mipidsi = { version = "0.10", optional = true }
embedded-graphics = { version = "0.8", optional = true }
embedded-hal-bus = { version = "0.3", optional = true }
esp-radio = { version = "=1.0.0-beta.1", optional = true, default-features = false, features = ["ble", "unstable", "log-04", "esp-alloc"] }
esp-rtos = { version = "0.4", optional = true, features = ["embassy", "esp-alloc", "esp-radio", "log-04"] }
esp-alloc = { version = "0.11", optional = true }
trouble-host = { version = "0.7", optional = true, features = ["log", "security", "legacy-pairing"] }
embassy-futures = { version = "0.1", optional = true }
embassy-time = { version = "0.5", optional = true }
esp-radio-rtos-driver = { version = "0.4", optional = true }
embassy-executor = { version = "0.10", optional = true }

[target.'cfg(all(target_os = "espidf", not(target_arch = "xtensa")))'.dependencies]
esp32-nimble = { version = "0.13", optional = true }

[target.xtensa-esp32-espidf.dependencies]
esp32-nimble = { version = "0.13", optional = true }

[target.xtensa-esp32s3-espidf.dependencies]
esp32-nimble = { version = "0.13", optional = true }
