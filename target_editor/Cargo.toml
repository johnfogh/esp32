[package]
name = "esp32-target-editor"
version = "0.5.0"
edition = "2024"
description = "GPUI host: flash firmware, device manager, sequences, target zones, and virtual sensors"
publish = false

[[bin]]
name = "target-editor"
path = "src/main.rs"

[dependencies]
utils = { package = "esp32-utils", path = "../utils", features = ["host"] }
scriptlib = { path = "../scriptlib" }
devicehostlib = { path = "../devicehostlib" }
targetlib = { path = "../targetlib" }
reportslib = { path = "../reportslib" }
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }

# gpui 0.2.2 -> zed-async-tar -> xattr 0.2.3 uses libc::ENOATTR, which current libc no
# longer exports on Linux. Local copy maps it to ENODATA (same value on Linux).
# gpui -> stacksafe-macro -> proc-macro-error2 2.0.1 re-exports a private `proc_macro`
# crate (E0365 / rust-lang#127909). Unmaintained; local copy makes `extern crate` public.
[patch.crates-io]
xattr = { path = "patches/xattr" }
proc-macro-error2 = { path = "patches/proc-macro-error2" }
