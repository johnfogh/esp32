[package]
name = "scriptlib"
version = "0.1.0"
edition = "2024"
description = "Lua 5.4 Stages runtime for target-editor"
publish = false

[lib]
path = "lib/lib.rs"

[dependencies]
mlua = { version = "0.11", default-features = false, features = ["lua54", "vendored"] }
serde_json = { version = "1", features = ["preserve_order"] }
targetlib = { path = "../targetlib" }
