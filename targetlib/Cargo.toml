[package]
name = "targetlib"
version = "0.1.0"
edition = "2024"
description = "Load, save, and query target_def JSON files"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
