[package]
name = "designer"
version = "0.1.0"
edition = "2021"

[dependencies]
base64 = "0.23.1"
gpui = "0.2.2"
# xattr 0.2.3 (via gpui) still needs Linux ENOATTR; removed in libc 0.2.190+
libc = "=0.2.189"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
utils = { package = "esp32-utils", path = "../utils", features = ["host"] }
