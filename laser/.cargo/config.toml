# Default: esp32 (Xtensa) + esp-hal. Use the aliases below for other chips.
[build]
target = "xtensa-esp32-none-elf"

[target.'cfg(all(target_arch = "xtensa", target_os = "none"))']
rustflags = ["-C", "link-arg=-nostartfiles", "-C", "link-arg=-Wl,-Tlinkall.x"]

[target.'cfg(all(target_arch = "riscv32", target_os = "none"))']
rustflags = ["-C", "link-arg=-Tlinkall.x", "-C", "force-frame-pointers"]

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
rustflags = ["--cfg", "espidf_time64"]

[env]
ESP_LOG = "info"

[unstable]
build-std = ["core", "alloc"]

[alias]
build-esp32   = "build --target xtensa-esp32-none-elf    --no-default-features --features esp32,hal"
build-s2      = "build --target xtensa-esp32s2-none-elf  --no-default-features --features esp32s2,hal"
build-s3      = "build --target xtensa-esp32s3-none-elf  --no-default-features --features esp32s3,hal"
build-c3      = "build --target riscv32imc-unknown-none-elf  --no-default-features --features esp32c3,hal"
build-c6      = "build --target riscv32imac-unknown-none-elf --no-default-features --features esp32c6,hal"
build-h2      = "build --target riscv32imac-unknown-none-elf --no-default-features --features esp32h2,hal"
build-esp32-idf = "build --target xtensa-esp32-espidf       --no-default-features --features esp32,idf   -Zbuild-std=std,panic_abort"
build-c3-idf    = "build --target riscv32imc-esp-espidf     --no-default-features --features esp32c3,idf -Zbuild-std=std,panic_abort"
build-c6-idf    = "build --target riscv32imac-esp-espidf    --no-default-features --features esp32c6,idf -Zbuild-std=std,panic_abort"
clippy-esp32  = "clippy --target xtensa-esp32-none-elf      --no-default-features --features esp32,hal"
clippy-c3     = "clippy --target riscv32imc-unknown-none-elf --no-default-features --features esp32c3,hal"
run-c3        = "run   --target riscv32imc-unknown-none-elf --no-default-features --features esp32c3,hal"
run-c3-idf    = "run   --target riscv32imc-esp-espidf      --no-default-features --features esp32c3,idf -Zbuild-std=std,panic_abort"

[target.xtensa-esp32-none-elf]
runner = "espflash flash --monitor"
[target.xtensa-esp32s2-none-elf]
runner = "espflash flash --monitor"
[target.xtensa-esp32s3-none-elf]
runner = "espflash flash --monitor"
[target.riscv32imc-unknown-none-elf]
runner = "espflash flash --monitor"
[target.riscv32imac-unknown-none-elf]
runner = "espflash flash --monitor"
[target.xtensa-esp32-espidf]
runner = "espflash flash --monitor"
[target.riscv32imc-esp-espidf]
runner = "espflash flash --monitor"
[target.riscv32imac-esp-espidf]
runner = "espflash flash --monitor"
